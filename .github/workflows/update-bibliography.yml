name: Refresh bibliography

# Weekly ADS sync. Regenerates the bibliography, rebuilds the PDF, opens a PR,
# and immediately merges it — the refresh goes live with no manual step.
# (Author/venue formatting is best-effort per update_bibliography.py's docstring;
# if you ever want to eyeball the diff first, delete the "Auto-merge" step below
# and the PR will just sit open for you to merge by hand.)
#
# Why the PDF is rebuilt HERE instead of leaving it to build-pdf.yml: the
# auto-merge step pushes to main using GITHUB_TOKEN, and GitHub does NOT trigger
# workflows from GITHUB_TOKEN pushes — so build-pdf.yml would never fire and
# teagueCV.pdf would drift out of sync with index.html. Bundling the rebuilt PDF
# into this same PR keeps the two in lockstep with no second workflow and no
# personal access token to manage. build-pdf.yml still covers hand edits to
# index.html pushed by a human.
#
# Also re-runs whenever update_bibliography.py itself is pushed to main, so a
# change to the formatting logic / PFL_ROSTER / MOST_CITED_COUNT is re-applied
# right away instead of waiting for Monday. Scoped to that one file on purpose:
# unrelated content edits shouldn't spawn a bibliography PR, and new ADS papers
# are already covered by the weekly schedule.
on:
  push:
    branches: [main]
    paths:
      - update_bibliography.py
  schedule:
    - cron: '0 12 * * 1'  # every Monday, 12:00 UTC
  workflow_dispatch: {}

# Serialize runs so a push and the schedule can't race on the shared PR branch.
concurrency:
  group: update-bibliography
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Run update_bibliography.py
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python3 update_bibliography.py

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Regenerate PDF
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: ./make-pdf.sh

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh publications & citation counts from ADS"
          title: "Automated bibliography refresh"
          body: >
            Auto-generated by the `update-bibliography` workflow and merged
            automatically. Refreshes the "Refereed Publications" list and the
            "Most Cited Publications" section (top 5 by ADS citation count, plus
            total citations and h-index), and rebuilds `teagueCV.pdf` to match.
            Citation counts drift week to week, so expect a diff even when no new
            paper has appeared.
          branch: bot/update-bibliography
          delete-branch: true

      # Immediately merge the PR the step above opened/updated. Uses GITHUB_TOKEN
      # (contents+pull-requests write, granted above); there are no required
      # checks and main is unprotected, so --merge lands right away. The PDF is
      # already in the PR, so no build-pdf.yml run is needed after this merge.
      - name: Auto-merge the pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --merge --delete-branch
